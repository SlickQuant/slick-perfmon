name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.build_type }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_SLICK_PERFMON_BENCH=ON

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -j 4

    - name: Run tests
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure

  # Clang on x86-64 Linux is not covered by the matrix above, which gets g++,
  # AppleClang and MSVC. It is also the configuration most likely to disagree
  # about the x86 intrinsic headers.
  clang-linux:
    name: Clang (${{ matrix.build_type }})
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    runs-on: ubuntu-latest

    env:
      CC: clang
      CXX: clang++

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_SLICK_PERFMON_BENCH=ON

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -j 4

    - name: Run tests
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure

  # The instrumentation-off build is a first-class configuration: it is what
  # ships to production, and nothing else in the matrix compiles it.
  disabled-build:
    name: SLICK_PERFMON_ENABLED=OFF
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSLICK_PERFMON_ENABLED=OFF

    - name: Build
      run: cmake --build build --config Release -j 4

    - name: Run tests
      working-directory: build
      run: ctest -C Release --output-on-failure

  # Two constraints that only bite on platforms the matrix runs last, if at all,
  # so they are forced onto a Linux job where a regression shows up immediately:
  #
  #  - SHM_NAME_MAX=25 is the macOS figure (PSHMNAMLEN caps a shm_open() name at
  #    31 bytes against NAME_MAX here). An over-long name fails nowhere else.
  #  - X86=0 is the steady_clock fallback every non-x86 build takes. It is the
  #    code AppleClang on arm64 actually compiles, and nothing else builds it.
  #  - CLOCK_GRANULARITY_NS quantises that fallback, which is the part that
  #    actually bites: Apple Silicon's steady_clock advances in ~41.67 ns steps,
  #    so whole spans land inside one tick and measure zero, and every "this
  #    interval must be positive" assertion fails. Linux has a nanosecond clock
  #    and cannot show that on its own.
  #
  # 100 ns rather than 42: the quantisation has to be coarse relative to a
  # *stamp*, and a stamp is cheaper here than on Apple Silicon because
  # clock_gettime is a vDSO call on Linux. 100 reproduces the failures that job
  # found and nothing else; coarser starts breaking tests macOS passes.
  #
  # Release because that is where it showed up - faster stamps fit inside a tick
  # more often, so Debug hides half of these.
  constrained-platform-build:
    name: macOS constraints on Linux
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: >
        cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_CXX_FLAGS="-DSLICK_PERFMON_SHM_NAME_MAX=25 -DSLICK_PERFMON_X86=0
        -DSLICK_PERFMON_CLOCK_GRANULARITY_NS=100 -Wno-cpp"

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -j 4

    - name: Run tests
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure

  # Unfenced timestamps are a supported configuration, so they have to keep
  # compiling and passing.
  unserialized-build:
    name: SLICK_PERFMON_SERIALIZE=OFF
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSLICK_PERFMON_SERIALIZE=OFF

    - name: Build
      run: cmake --build build --config Release -j 4

    - name: Run tests
      working-directory: build
      run: ctest -C Release --output-on-failure

  # The hot path is lock-free and the backend is single-threaded by design, so
  # a data race here would be a design failure rather than a missing mutex.
  sanitizers:
    name: Sanitizers (${{ matrix.sanitizer }})
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread, undefined]

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: >
        cmake -B build -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer -g"
        -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}"

    - name: Build
      run: cmake --build build --config Debug -j 4

    - name: Run tests
      working-directory: build
      env:
        ASAN_OPTIONS: abort_on_error=1:detect_stack_use_after_return=1
        TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: ctest -C Debug --output-on-failure
